<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>METRO GRID - 2.5D Isometric Metro Tycoon</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0f172a;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #canvas-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }
      canvas.emscripten {
        border: 0px none;
        background-color: #000;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 16 / 9;
        display: block;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        outline: none;
      }
      #fs-btn {
        position: fixed;
        bottom: 12px;
        right: 12px;
        background: rgba(15, 23, 42, 0.85);
        color: #94a3b8;
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 6px;
        padding: 6px 14px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s ease;
        z-index: 100;
        backdrop-filter: blur(6px);
        user-select: none;
      }
      #fs-btn:hover {
        background: rgba(30, 41, 59, 0.95);
        color: #38bdf8;
        border-color: #38bdf8;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
      }
      #loading {
        position: absolute;
        color: #38bdf8;
        font-weight: 600;
        font-size: 18px;
        letter-spacing: 1px;
        pointer-events: none;
        transition: opacity 0.4s ease;
        z-index: 50;
      }
    </style>
  </head>
  <body>
    <div id="loading">LOADING METRO GRID OCC DISPATCH...</div>
    <div id="canvas-container">
      <canvas class="emscripten" id="canvas" width="1280" height="720" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>
    <button id="fs-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>

    <script type="text/javascript">
      function toggleFullscreen() {
        var canvas = document.getElementById('canvas');
        if (!document.fullscreenElement) {
          if (canvas.requestFullscreen) canvas.requestFullscreen();
          else if (canvas.webkitRequestFullscreen) canvas.webkitRequestFullscreen();
          else if (canvas.msRequestFullscreen) canvas.msRequestFullscreen();
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
        }
      }
      // Prevent browser scrolling with arrow keys, tab, or spacebar
      window.addEventListener("keydown", function(e) {
        if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Tab"].indexOf(e.code) > -1) {
          e.preventDefault();
        }
      }, false);

      var buildHash = "v" + Date.now();
      var Module = {
        locateFile: function(path, prefix) {
          if (path.indexOf('.wasm') > -1) {
            return (prefix || '') + path + '?v=' + buildHash;
          }
          return (prefix || '') + path;
        },
        print: function(text) { console.log(text); },
        printErr: function(text) { console.error(text); },
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener("webglcontextlost", function(e) {
            alert('WebGL context lost. Please reload the page.');
            e.preventDefault();
          }, false);
          return canvas;
        })(),
        setStatus: function(text) {
          var loading = document.getElementById('loading');
          if (text) {
            loading.innerText = text;
          } else {
            loading.style.opacity = '0';
            setTimeout(function() { loading.style.display = 'none'; }, 400);
          }
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'PREPARING ASSETS (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')...' : '');
        }
      };
      Module.setStatus('DOWNLOADING METRO GRID CORE...');
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
